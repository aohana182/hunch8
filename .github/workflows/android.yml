name: android

on:
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Create local.properties with placeholder proxy URL
        run: echo "hunch8.proxyUrl=https://mock-worker.workers.dev" > local.properties
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Lint and build debug APK
        run: ./gradlew lintDebug assembleDebug --no-daemon
